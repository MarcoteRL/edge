name: ios-sideload

# Personal-repo build: unsigned .ipa for Sideloadly/AltStore, NO secrets needed.
#
# Why this exists next to build.yml: build.yml only runs on `v*` tags, needs the
# upstream release secrets (Android keystore, Firebase config, companion URL),
# and its "Mount Firebase Secrets" step overwrites lib/firebase_options.dart
# with an empty file when the secret is unset, which breaks the Dart compile.
# This workflow skips all of that and relies on what the project already ships
# for secretless builds:
#   - lib/firebase_options.dart is committed (dummy values), main() catches a
#     failed Firebase.initializeApp and carries on without Firebase.
#   - the "Ensure GoogleService-Info.plist" Xcode phase writes an inert
#     placeholder plist when the file is missing.
#   - the Crashlytics symbol-upload phase ends in `|| true`.
# See docs/development/IOS_BUILD_PIPELINE.md.

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Home-screen name (keep it short, ~12 chars)
        default: Edge Dev
      icon_hue:
        description: Icon hue shift in degrees (0 = upstream colours)
        default: '150'
      runner:
        description: macOS runner (macos-15-intel when arm64 has no capacity)
        default: macos-latest
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'guides/**'
      - 'screenshots/**'

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    # Never runs on the upstream repo, which has its own release pipeline.
    if: github.repository != 'OpenStrap/edge'
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # BGContinuedProcessingTask needs the iOS 26 SDK. macos-latest already
      # defaults to Xcode 26; the Intel image does not, so pick the newest 26.
      - name: Select Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          # Same pin as build.yml/test.yml. Bump all three together.
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      # No .env / --dart-define: every build-time define defaults off.
      # COMPANION_URL and BACKEND_URL default to '' (OTA pointer, BYOK proxy and
      # legacy cloud import disabled; both can still be set at runtime in
      # Settings) and ENABLE_HEALTH_DATA_CONTRIBUTION defaults to false, so the
      # health-data upload feature is compiled out of this personal build.

      # Upstream's release job installs it for the Crashlytics build phase. That
      # phase tolerates its absence (`|| true`); installing keeps us on the same
      # known-good path.
      - name: Install flutterfire CLI
        run: dart pub global activate flutterfire_cli 1.4.0

      - run: flutter pub get

      # CI-04: `pod install` was ~118 s of every IPA (run 43587926781), on a
      # runner billed at 10x. The Pods are a pure function of Podfile.lock and
      # the plugin versions in pubspec.lock, so either changing misses the
      # cache and pod install runs in full, as before.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}

      # Different home-screen name and icon colour so this build can't be
      # mistaken for upstream's. Applied to the CI checkout only, never
      # committed; the bundle id is untouched so installs keep their data.
      - name: Fork branding
        env:
          APP_NAME: ${{ inputs.app_name || 'Edge Dev' }}
          ICON_HUE: ${{ inputs.icon_hue || '150' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/brand"
          "$RUNNER_TEMP/brand/bin/pip" install -q pillow
          "$RUNNER_TEMP/brand/bin/python" .github/scripts/fork_branding.py "$APP_NAME" "$ICON_HUE"

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      # The Watch companion cannot survive a per-user free-account resign
      # (WKCompanionAppBundleIdentifier no longer matches). Same as build.yml.
      - name: Strip Watch companion
        run: rm -rf "build/ios/iphoneos/Runner.app/Watch"

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name="openstrap-edge-${ver%%+*}-${GITHUB_SHA::7}-unsigned.ipa"
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr -y "$GITHUB_WORKSPACE/$name" Payload
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Unsigned IPA"
            echo "- File: \`$name\` ($(du -h "$GITHUB_WORKSPACE/$name" | cut -f1))"
            echo "- Version: \`$ver\`, commit \`${GITHUB_SHA::7}\`"
            echo "- Bundle id: \`$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Runner.app/Info.plist)\`"
            echo "- Sign and install with Sideloadly. Widgets/Live Activities may not work on a free Apple ID (App Groups)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.name }}
          if-no-files-found: error
          retention-days: 14
